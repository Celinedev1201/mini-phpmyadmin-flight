services:
  # Serveur MySQL
  mysql:
    image: mysql:8.4
    container_name: mini_phpmyadmin_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Serveur PostgreSQL
  postgres:
    image: postgres:17
    container_name: mini_phpmyadmin_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # API FlightPHP : accès aux deux serveurs
  backend:
    build:
      context: ./backend

    container_name: mini_phpmyadmin_backend

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/var/www/html
      - ./backups:/var/backups/safebase

    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Planificateur cron : sauvegardes MySQL et PostgreSQL
  scheduler:
    build:
      context: ./backend

    container_name: mini_phpmyadmin_scheduler
    init: true

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_DATABASE: ${BACKUP_DATABASE:-atelier_theoa}
      PG_BACKUP_DATABASE: ${PG_BACKUP_DATABASE:-${POSTGRES_DB}}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./backend:/var/www/html
      - ./backups:/var/backups/safebase

    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - php bin/configure-cron.php && exec cron -f

  # Interface React
  frontend:
    build:
      context: ./frontend

    container_name: mini_phpmyadmin_frontend

    environment:
      VITE_API_URL: http://localhost:8000

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

# Stockages persistants, séparés pour chaque serveur
volumes:
  mysql_data:
  frontend_node_modules:
  postgres_data:
