name: CI/CD - SafeBase

on:
  push:
    branches:
      - main
      - tp-ci-cd
    tags:
      - "v*"

jobs:
  unit-tests:
    name: Tests unitaires PHP
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Tester la validation des noms SQL
        run: |
          docker run --rm -v "$PWD/backend:/app:ro" -w /app php:8.3-cli-bookworm php tests/unit.php

  functional-tests:
    name: Tests fonctionnels MySQL et PostgreSQL
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la configuration de test
        run: cp .env.exemple .env

      - name: Installer les dépendances PHP
        run: docker compose run --rm --no-deps backend composer install --no-interaction

      - name: Exécuter les six tests fonctionnels
        run: docker compose run --rm tests

  build-images:
    name: Construire et publier l’image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: functional-tests

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Construire et publier l’image Docker
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            target=production
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            target=development
            tag=dev
          else
            target=development
            tag=dev-test
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE:$tag"

          docker build --provenance=false --target "$target" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image" "./$SERVICE"

          docker push "$image"

  notify-discord:
    name: Notifier Discord
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests, build-images]
    if: ${{ always() }}

    permissions:
      actions: read

    steps:
      - name: Envoyer le résultat à Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if jq -e 'all(.[]; . == "success")' <<< "$RESULTS" >/dev/null; then
            status="✅ Succès"
            details="Tests réussis et images publiées sur GHCR."
          elif jq -e 'any(.[]; . == "failure")' <<< "$RESULTS" >/dev/null; then
            status="❌ Échec"
            details="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") |
                    .name + " — " + ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))' \
              || true)"
            details="${details:-Consulte les logs GitHub Actions.}"
          else
            status="⚪ Interrompu"
            details="Exécution annulée ou jobs ignorés."
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="$(printf '**SafeBase CI/CD — %s**\nBranche ou tag : `%s`\nCommit : `%s`\n%s\n%s' \
            "$status" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "$details" "$run_url")"

          jq -n --arg content "$message" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary @- "$DISCORD_WEBHOOK_URL"
